<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arena Blaster</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0a0a0a;
        overflow: hidden;
      }
      #app {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }
      canvas {
        width: min(100%, 960px);
        height: auto;
        aspect-ratio: 16 / 9;
        display: block;
        background: #111827;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game" width="960" height="540"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
