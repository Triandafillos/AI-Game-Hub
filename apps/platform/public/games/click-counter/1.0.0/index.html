<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Click Counter</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: #0a0a0a;
        color: #f4f4f5;
      }
      .card {
        text-align: center;
        padding: 2rem;
      }
      button {
        margin-top: 1rem;
        padding: 0.75rem 1.25rem;
        border: none;
        border-radius: 0.5rem;
        background: #4f46e5;
        color: white;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background: #4338ca;
      }
      .status {
        margin-top: 1rem;
        font-size: 0.875rem;
        color: #a1a1aa;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Click Counter</h1>
      <p id="count">0</p>
      <button id="click-btn" type="button">Click me</button>
      <p id="status" class="status">Loading save...</p>
    </div>
    <script>
      const countEl = document.getElementById("count");
      const statusEl = document.getElementById("status");
      const clickBtn = document.getElementById("click-btn");
      let count = 0;

      function createRequestId() {
        return Date.now() + "-" + Math.random().toString(36).slice(2, 9);
      }

      function sendRequest(message) {
        return new Promise((resolve, reject) => {
          const requestId = message.requestId || createRequestId();
          message.requestId = requestId;

          const timer = setTimeout(() => {
            window.removeEventListener("message", onMessage);
            reject(new Error("Platform request timed out"));
          }, 10000);

          function onMessage(event) {
            if (event.origin !== window.location.origin) return;
            const data = event.data;
            if (!data || data.requestId !== requestId) return;

            if (
              data.type === "platform:user" ||
              data.type === "platform:loadResult" ||
              data.type === "platform:saveResult"
            ) {
              clearTimeout(timer);
              window.removeEventListener("message", onMessage);
              resolve(data);
            }
          }

          window.addEventListener("message", onMessage);
          window.parent.postMessage(message, window.location.origin);
        });
      }

      async function loadSave() {
        const result = await sendRequest({ type: "platform:load" });
        if (result.type === "platform:loadResult" && result.data && typeof result.data.count === "number") {
          count = result.data.count;
          countEl.textContent = String(count);
        }
        statusEl.textContent = "Ready";
      }

      async function saveProgress() {
        statusEl.textContent = "Saving...";
        const result = await sendRequest({
          type: "platform:save",
          data: { count },
        });
        if (result.type === "platform:saveResult" && result.ok) {
          statusEl.textContent = "Saved";
        } else {
          statusEl.textContent = result.error || "Save failed (log in to save)";
        }
      }

      clickBtn.addEventListener("click", async () => {
        count += 1;
        countEl.textContent = String(count);
        await saveProgress();
      });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          saveProgress();
        }
      });

      loadSave().catch(() => {
        statusEl.textContent = "Ready (no save loaded)";
      });
    </script>
  </body>
</html>
